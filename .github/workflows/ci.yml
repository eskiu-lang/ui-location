name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: |
          curl -fsSL https://eskiu-lang.org/install.sh -o install.sh
          ESKIU_PREFIX=$HOME/.eskiu sh install.sh
          echo "$HOME/.eskiu/bin" >> $GITHUB_PATH
      - name: Tests
        run: eskiuc test
      - name: Tests (-O2)
        run: eskiuc test -O2
      - name: The example type-checks
        run: cd examples/where && eskiuc fetch && eskiuc src/main.esk --test-typechecker

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Tests
        run: eskiuc test
      - name: The example type-checks
        run: cd examples/where && eskiuc fetch && eskiuc src/main.esk --test-typechecker
